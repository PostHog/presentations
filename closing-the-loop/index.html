<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Closing the loop</title>
<link rel="icon" href="../img/posthog-logomark.svg" />
<style>
  :root {
    --bg1: #FFF1D5; --bg2: #DAE0EB; --card: #fff; --ink: #141414; --ink2: #4F4E48; --ink3: #87867E;
    --rule: #D9D8D0; --accent: #F54E00; --blue: #1D4AFF; --fail: #db3707; --pass: #388600; --warn: #f7a501;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 3vw 1.6vh; gap: 2vh; }

  /* Loop diagram, always visible */
  header { display: flex; align-items: center; gap: 2vw; }
  header .brand { display: flex; flex-direction: column; gap: .3vh; min-width: 15vw; }
  header .brand .eyebrow { font-family: var(--mono); font-size: 1.05vw; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  header .brand .title { font-size: 2vw; font-weight: 800; letter-spacing: -.02em; }
  .loop { flex: 1; height: 15vh; }
  .loop svg { width: 100%; height: 100%; overflow: visible; }
  .node rect { fill: var(--card); stroke: var(--rule); stroke-width: 2; transition: all .35s; }
  .node text { font: 700 18px var(--body); fill: var(--ink2); transition: fill .35s; }
  .node.done rect { stroke: var(--ink3); }
  .node.done text { fill: var(--ink); }
  .node.active rect { stroke: var(--accent); stroke-width: 3.5; fill: #fff7ef; }
  .node.active text { fill: var(--accent); }
  .node.active.fail rect { stroke: var(--fail); fill: #fdebe5; }
  .node.active.fail text { fill: var(--fail); }
  .node.active.pass rect { stroke: var(--pass); fill: #ecf6e4; }
  .node.active.pass text { fill: var(--pass); }
  .edge { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .back { stroke: var(--rule); stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; transition: stroke .35s; marker-end: url(#arrowBack); }
  .back.lit { stroke: var(--fail); stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease forwards; marker-end: url(#arrowFail); }
  .backlabel { font: 600 14px var(--body); fill: var(--ink3); transition: fill .35s; }
  .backlabel.lit { fill: var(--fail); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  main { display: grid; grid-template-columns: 31vw 1fr; gap: 2.4vw; min-height: 0; }

  /* Timeline */
  .timeline { display: flex; flex-direction: column; min-height: 0; }
  .chapter { font-family: var(--mono); font-size: 1vw; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-bottom: .6vh; }
  .chapter-title { font-size: 1.9vw; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; margin: 0 0 2vh; text-wrap: balance; }
  ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1vh; overflow: hidden; }
  ol.steps li { display: grid; grid-template-columns: 8.4vw 1fr; gap: .9vw; align-items: baseline; opacity: .45; transition: opacity .3s, transform .3s; }
  ol.steps li.current { opacity: 1; }
  ol.steps li.enter { animation: enter .35s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  .when { font-family: var(--mono); font-size: 1.05vw; color: var(--ink3); text-align: right; white-space: nowrap; }
  .when b { color: var(--accent); font-weight: 700; }
  .what { font-size: 1.3vw; font-weight: 600; line-height: 1.3; }
  li.fail .what { color: var(--fail); }
  li.pass .what { color: var(--pass); }
  li .what .tag { display: inline-block; font-size: .85vw; font-weight: 700; padding: .1vh .5vw; border-radius: 99px; margin-left: .4vw; vertical-align: middle; color: #fff; }
  li.fail .tag { background: var(--fail); }
  li.pass .tag { background: var(--pass); }

  /* Evidence pane */
  .pane { position: relative; min-height: 0; display: flex; flex-direction: column; gap: 1.4vh; }
  .say { font-size: 1.75vw; font-weight: 600; line-height: 1.3; color: var(--ink); margin: 0; text-wrap: balance; }
  .callout { margin: 0; font-size: 1.25vw; line-height: 1.4; color: var(--ink2); background: rgba(255,255,255,.65); border-left: 4px solid var(--blue); border-radius: 0 10px 10px 0; padding: 1.1vh 1vw; max-width: 52vw; }
  .callout b { color: var(--blue); }
  .say em { font-style: normal; color: var(--accent); }
  .shot { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  .shot img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; background: #fff;
    border: 1px solid var(--rule); box-shadow: 0 18px 50px rgba(20,20,20,.16); cursor: zoom-in; animation: pop .35s ease; }
  .shot.pair { gap: 1.4vw; align-items: flex-start; }
  .shot.pair img { max-width: 49%; }
  @keyframes pop { from { opacity: 0; transform: scale(.985); } }

  /* Big-statement scenes */
  .big { grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: center; gap: 3vh; padding: 0 4vw; }
  .big h1 { font-size: 5vw; font-weight: 800; letter-spacing: -.03em; line-height: 1.02; margin: 0; text-wrap: balance; }
  .big h1 span { color: var(--accent); }
  .big p { font-size: 2vw; color: var(--ink2); margin: 0; max-width: 60vw; line-height: 1.35; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6vw; }
  .stat { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 2.4vh 1.4vw; }
  .stat .n { font-size: 4.4vw; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .stat .l { font-size: 1.25vw; color: var(--ink2); margin-top: 1.2vh; line-height: 1.3; }
  .stat.hot .n { color: var(--fail); }
  .cols { display: grid; grid-template-columns: 1fr .7fr 1fr; gap: 1.6vw; }
  .cols.two { grid-template-columns: 1fr 1fr; }
  .col { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 2.2vh 1.6vw; }
  .col .k { font-family: var(--mono); font-size: 1.05vw; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1vh; }
  .col ul { margin: 0; padding-left: 1.2em; font-size: 1.6vw; line-height: 1.45; font-weight: 600; }
  .col.cheap { background: transparent; border-style: dashed; color: var(--ink3); }
  .col.cheap .k { color: var(--ink3); }
  .dial .bar { height: 2.2vh; border-radius: 99px; background: linear-gradient(90deg, var(--pass), var(--warn), var(--fail)); }
  .dial .ends { display: flex; justify-content: space-between; gap: 4vw; margin-top: 1.6vh; font-size: 1.5vw; color: var(--ink2); line-height: 1.35; }
  .dial .ends > div { max-width: 32vw; }
  .dial .ends > div:last-child { text-align: right; }
  .dial .ends b { display: block; font-size: 2vw; color: var(--ink); }
  .flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2vw; counter-reset: f; }
  .flow li { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 1.8vh 1.1vw; font-size: 1.3vw; font-weight: 600; line-height: 1.35; }
  .flow li:not(:last-child)::after { content: '→'; position: absolute; right: -1.05vw; top: 50%; transform: translateY(-50%); color: var(--ink3); font-size: 1.3vw; }
  .flow .who { display: block; font-family: var(--mono); font-size: .9vw; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: .8vh; }
  .flow .who.me { color: var(--accent); }
  .flow .who.bot { color: var(--blue); }
  .qa { display: grid; grid-template-columns: 1fr auto; gap: 4vw; align-items: center; }
  .posts { display: flex; flex-direction: column; gap: 1vh; margin-top: 2.4vh; }
  .posts .k { font-family: var(--mono); font-size: 1vw; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-top: 1.4vh; }
  .posts a.feature { font-size: 2.2vw; color: var(--accent); }
  .posts a.feature small { display: block; font-family: var(--mono); font-size: .95vw; font-weight: 500; color: var(--ink2); }
  .posts a { font-size: 1.45vw; font-weight: 600; color: var(--ink); text-decoration: none; border-left: 4px solid var(--accent); padding-left: 1vw; }
  .posts a:hover { color: var(--accent); }
  .qr { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
  .qr img { width: 24vw; max-width: 50vh; background: #fff; border-radius: 12px; padding: 1vw; border: 1px solid var(--rule); }
  .qr.small img { width: 16vw; }
  .qa > div { display: flex; flex-direction: column; gap: 3vh; }
  .qr figcaption { font-family: var(--mono); font-size: 1vw; color: var(--ink2); }
  .footnote { font-size: 1vw; color: var(--ink3); font-family: var(--mono); }

  .links { display: flex; flex-wrap: wrap; gap: .6vw; margin-top: -.4vh; }
  a.link { font-family: var(--mono); font-size: .95vw; font-weight: 600; color: var(--accent); text-decoration: none;
    border: 1.5px solid var(--accent); border-radius: 99px; padding: .35vh .8vw; background: rgba(255,255,255,.6); }
  a.link:hover { background: var(--accent); color: #fff; }

  .chartwrap { grid-column: 1 / -1; display: flex; flex-direction: column; min-height: 0; gap: 1vh; }
  .charthead { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; }
  .charthead .chapter-title { margin: 0; }
  svg.chart { flex: 1; min-height: 0; width: 100%; }
  svg.chart .grid { stroke: #D9D8D0; stroke-width: 1; }
  svg.chart .ax { font: 500 14px var(--mono); fill: #87867E; }
  svg.chart .ax.blue, svg.chart .blue { fill: #1D4AFF; }
  svg.chart .lg { font: 600 15px var(--body); fill: #4F4E48; }
  svg.chart .sw.red { fill: #db3707; }
  svg.chart .val { font: 700 15px var(--mono); paint-order: stroke; stroke: rgba(0,0,0,.18); stroke-width: 3px; opacity: 0; transition: opacity .4s .2s; }
  svg.chart .val.on { opacity: 1; }
  svg.chart .nline { fill: none; stroke: #1D4AFF; stroke-width: 3; stroke-linejoin: round; opacity: .22; transition: opacity .6s; }
  svg.chart .nline.on { opacity: 1; }
  svg.chart .num { font: 800 15px var(--body); fill: #fff; }
  svg.chart .evt { font: 700 18px var(--body); }
  svg.chart .big1 { font: 800 24px var(--body); fill: #141414; }
  svg.chart .bar { transition: fill .5s ease, opacity .5s ease; }
  svg.chart .ev { opacity: 0; transform: translateY(-6px); transition: opacity .35s ease, transform .35s ease; }
  svg.chart .ev.on { opacity: 1; transform: none; }
  svg.chart .ev .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); transition: transform .5s ease .1s; }
  svg.chart .ev.on .drop { transform: scaleY(1); }
  svg.chart .summary { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }
  svg.chart .summary.on { opacity: 1; transform: none; }
  .steplink { min-height: 1.6em; }

  footer { display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: .95vw; color: var(--ink3); }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; max-width: 40vw; justify-content: center; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); }
  .dots i.on { background: var(--accent); }
  .dots i.sep { width: 2px; background: transparent; }

  /* Lightbox and notes */
  .lightbox { position: fixed; inset: 0; background: rgba(20,20,20,.82); display: none; align-items: center; justify-content: center; padding: 3vh 3vw; z-index: 10; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
  .notes { position: fixed; right: 1.5vw; bottom: 5vh; width: 34vw; background: #141414; color: #f3f3f3; border-radius: 10px; padding: 1.6vh 1.2vw; font-size: 1.05vw; line-height: 1.45; display: none; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .notes.open { display: block; }
  .notes b { color: #F9BD2B; font-family: var(--mono); font-size: .85vw; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: .6vh; }
  .nav { display: none; gap: 8px; }
  .nav button { font: 700 18px var(--body); color: var(--accent); background: var(--card); border: 1.5px solid var(--accent); border-radius: 99px; width: 52px; height: 44px; }
  .nav button:disabled { opacity: .3; }

  /* Phones: the projector layout is sized in vw, which shrinks to unreadable text. Stack and scroll instead. */
  @media (max-width: 800px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow: auto; }
    .stage { height: auto; min-height: 100dvh; padding: 16px 16px 84px; gap: 16px; grid-template-rows: auto 1fr; }
    header { flex-direction: column; align-items: flex-start; gap: 6px; }
    header .brand .eyebrow { font-size: 11px; }
    header .brand .title { font-size: 22px; }
    .loop { width: 100%; height: auto; }
    main { grid-template-columns: 1fr; gap: 16px; }
    .chapter { font-size: 11px; }
    .chapter-title { font-size: 22px; margin-bottom: 10px; }
    ol.steps li { grid-template-columns: 76px 1fr; gap: 10px; }
    .when { font-size: 11px; }
    .what { font-size: 14px; }
    li .what .tag { font-size: 11px; padding: 1px 6px; }
    .say { font-size: 18px; }
    .callout { font-size: 15px; padding: 10px 12px; max-width: none; }
    a.link { font-size: 13px; padding: 4px 10px; }
    .shot.pair { flex-direction: column; }
    .shot.pair img { max-width: 100%; }
    .big { padding: 0; gap: 16px; justify-content: flex-start; }
    .big h1 { font-size: 32px; }
    .big p { font-size: 17px; max-width: none; }
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 12px; }
    .stat .n { font-size: 30px; }
    .stat .l { font-size: 13px; }
    .footnote { font-size: 11px; }
    .cols, .cols.two, .flow { grid-template-columns: 1fr; gap: 10px; }
    .col { padding: 12px 14px; }
    .col .k, .flow .who { font-size: 11px; }
    .col ul { font-size: 16px; }
    .flow li { font-size: 15px; padding: 12px 14px; }
    .flow li:not(:last-child)::after { content: '↓'; right: auto; left: 50%; top: auto; bottom: -15px; transform: translateX(-50%); font-size: 14px; }
    .dial .ends { flex-direction: column; gap: 12px; font-size: 15px; }
    .dial .ends > div { max-width: none; }
    .dial .ends > div:last-child { text-align: left; }
    .dial .ends b { font-size: 20px; }
    .qa { grid-template-columns: 1fr; gap: 20px; }
    .posts .k { font-size: 11px; }
    .posts a { font-size: 16px; padding-left: 10px; }
    .posts a.feature { font-size: 24px; }
    .posts a.feature small { font-size: 11px; }
    .qr { display: none; }
    .chartwrap { overflow-x: auto; }
    .charthead { flex-direction: column; gap: 8px; }
    svg.chart { flex: none; min-width: 620px; }
    .charthead::after { content: 'Scroll the chart sideways →'; font-family: var(--mono); font-size: 11px; color: var(--ink3); }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; font-size: 12px; background: rgba(255,255,255,.92); border-top: 1px solid var(--rule); }
    .dots, .keys { display: none; }
    .nav { display: flex; }
    .notes { width: auto; left: 16px; right: 16px; bottom: 72px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="brand">
      <span class="eyebrow">AI Tinkerers Dublin</span>
      <span class="title">Closing the loop</span>
    </div>
    <div class="loop">
      <svg viewBox="0 0 1040 120" preserveAspectRatio="xMidYMid meet" aria-label="The self-driving loop">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#87867E"/></marker>
          <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D9D8D0"/></marker>
          <marker id="arrowFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db3707"/></marker>
        </defs>
        <g id="nodes"></g>
        <path id="back" class="back" />
        <text id="backlabel" class="backlabel" y="106" text-anchor="middle">didn't hold → new report</text>
      </svg>
    </div>
  </header>

  <main id="main"></main>

  <footer>
    <span id="crumb"></span>
    <span class="dots" id="dots"></span>
    <span class="keys">← → step · N notes · F fullscreen</span>
    <span class="nav"><button id="prev" aria-label="Previous step">←</button><button id="next" aria-label="Next step">→</button></span>
  </footer>
</div>
<div class="lightbox" id="lightbox"><img alt="" /></div>
<div class="notes" id="notes"></div>

<script>
const NODES = [
  { id: 'signal', label: 'Signal' },
  { id: 'report', label: 'Report' },
  { id: 'pr', label: 'Agent PR' },
  { id: 'review', label: 'Human review' },
  { id: 'merged', label: 'Merged' },
  { id: 'check', label: 'Re-check' },
]

const A = 'assets/'

// One scene per key press. `log` lines accumulate within a chapter.
const SCENES = [
  { kind: 'big', chapter: 'intro', node: null,
    html: `<div class="qa">
      <div>
        <h1>Agents ship PRs now.<br><span>Closing the loop<br>is the hard part.</span></h1>
        <p>One real loop from PostHog's own product, October 2026. Every timestamp is from the API, every screenshot is the real thing.</p>
      </div>
      <figure class="qr small"><img src="${A}qr.svg" alt="QR code for this walkthrough"><figcaption>Follow along on your phone</figcaption></figure>
    </div>`,
    notes: 'I build the loops that build PostHog. Most demos stop at the merged PR. This one keeps going: did the fix actually work, and what happens when it did not?' },

  // Inbox search: two loops
  { chapter: 'search', title: 'Inbox search: fixed, checked, fixed again', node: 'signal',
    when: '13 Oct 05:19', what: 'Slow query alert from pganalyze',
    say: 'A database monitor flags a slow <em>count(*)</em>: 385ms on average, 66 calls a day.',
    callout: '<b>Who felt it most?</b> Agents searching the inbox over MCP on behalf of their users, more than people typing in the search box. We only found that out on the second loop.',
    links: [{ label: 'Report', href: 'https://us.posthog.com/project/2/inbox/01a133b3-b87d-7d72-a0d9-502221f9906d' }],
    img: 'search-evidence.png',
    notes: 'No human filed this. A Postgres monitor fired, and it became a signal. The twist: the slow searches were mostly agents using the inbox through MCP for their users, sometimes 10 seconds a search. The first report assumed people. The second loop worked out it was agents.' },
  { chapter: 'search', node: 'report',
    when: '05:19', what: 'Agent researches and writes the report',
    say: 'The agent finds the cause in the code and <em>predicts the impact</em>: "under 100ms, more than a 10x gain".',
    links: [{ label: 'Report', href: 'https://us.posthog.com/project/2/inbox/01a133b3-b87d-7d72-a0d9-502221f9906d' }],
    img: 'search-report.png',
    notes: 'Point at "Expected impact" at the bottom. That prediction is what gets checked later. Write it down or you can never close the loop.' },
  { chapter: 'search', node: 'pr', delta: '+26m',
    when: '05:45', what: 'Agent opens PR #115874',
    say: 'A coding agent opens the PR: two trigram indexes. <em>All tests pass.</em>',
    links: [{ label: 'PR #115874', href: 'https://github.com/PostHog/posthog/pull/115874' }],
    img: 'search-pr1.png',
    notes: 'Nobody started this task by hand. It auto-started once the report was rated ready to fix.' },
  { chapter: 'search', node: 'merged', delta: '+1d',
    when: '14 Oct 06:27', what: 'I review it. Merged',
    say: 'I approve it, it merges, it deploys. <em>Most loops stop here.</em>',
    links: [{ label: 'PR #115874', href: 'https://github.com/PostHog/posthog/pull/115874' }],
    img: 'search-pr1.png',
    notes: 'This is where most agent demos end: green CI, merged, done. Pause here.' },
  { chapter: 'search', node: 'check', verdict: 'fail', delta: '+2d 9h',
    when: '16 Oct 15:43', what: 'Re-check: no longer holds',
    say: 'Two days later a scout probes production. <em>18 of the 20 slowest searches still take 1.8 to 11.7s.</em>',
    links: [{ label: 'Report with the failed check', href: 'https://us.posthog.com/project/2/inbox/01a133b3-b87d-7d72-a0d9-502221f9906d' }],
    img: 'search-check-failed.png',
    notes: 'The scout ran the same kind of query the report used as its baseline, after a 48 hour soak. The fix did not do what it claimed.' },
  { chapter: 'search', node: 'report', back: true, delta: '+0m',
    when: '15:43', what: 'Same run files a follow-up report',
    say: 'The failed check <em>files its own follow-up</em>, with the evidence attached.',
    links: [{ label: 'Follow-up report', href: 'https://us.posthog.com/project/2/inbox/01a14561-c1a5-7523-acdf-489788bffb08' }],
    img: ['search-followup-report.png', 'search-followup-evidence.png'],
    notes: 'Same minute. The loop goes round again on its own.' },
  { chapter: 'search', node: 'pr', delta: '+28m',
    when: '16:11', what: 'Agent opens PR #118678, a different fix',

// Inbox search count spans per day (posthog-web-django, SELECT COUNT(*) on signals_signalreport with the
// UPPER(title) LIKE search predicate), from posthog.trace_spans. Database spans for this service start at 03:02 UTC on 13 Oct, so the chart starts that day.
const SEARCH_DAYS = [
  { d: '13', n: 1725, slow: 3, p99: 865 },
  { d: '14', n: 1708, slow: 32, p99: 2011 },
  { d: '15', n: 1754, slow: 38, p99: 1712 },
  { d: '16', n: 1090, slow: 29, p99: 1617 },
  { d: '17', n: 214, slow: 2, p99: 790 },
  { d: '18', n: 125, slow: 1, p99: 779 },
  { d: '19', n: 192, slow: 2, p99: 743 },
  { d: '20', n: 324, slow: 8, p99: 2283 },
  { d: '21', n: 136, slow: 2, p99: 1231 },
  { d: '22', n: 154, slow: 1, p99: 751 },
  { d: '23', n: 155, slow: 1, p99: 676 },
  { d: '24', n: 214, slow: 0, p99: 661 },
  { d: '25', n: 143, slow: 1, p99: 633 },
  { d: '26', n: 169, slow: 1, p99: 827 },
]
// Day offsets from 13 Oct 00:00 UTC.
const SEARCH_EVENTS = [
  { at: 0 + 5.3 / 24, n: 1, text: 'Report: search counts are slow', tone: 'ink', link: 'https://us.posthog.com/project/2/inbox/01a133b3-b87d-7d72-a0d9-502221f9906d' },
  { at: 1 + 6.45 / 24, n: 2, text: 'Index fix merged. "10x faster"', tone: 'ink', link: 'https://github.com/PostHog/posthog/pull/115874' },
  { at: 3 + 15.72 / 24, n: 3, text: 'Re-check: still slow. New report', tone: 'fail', link: 'https://us.posthog.com/project/2/inbox/01a14561-c1a5-7523-acdf-489788bffb08' },
  { at: 3 + 17.92 / 24, n: 4, text: 'Second fix merged', tone: 'ink', link: 'https://github.com/PostHog/posthog/pull/118678' },
  { at: 6 + 2.67 / 24, n: 5, text: 'Re-check: holds', tone: 'pass', link: 'https://us.posthog.com/project/2/inbox/01a14561-c1a5-7523-acdf-489788bffb08' },
]

const CW = 1000, CH = 520, CL = 60, CR = 70, CT = 175, CB = 60
const CPW = CW - CL - CR, CPH = CH - CT - CB
const cx = (t) => CL + (t / SEARCH_DAYS.length) * CPW
const cys = (v) => CT + CPH - (v / 40) * CPH
const cyn = (v) => CT + CPH - (v / 2000) * CPH
const TONE = { ink: '#141414', fail: '#db3707', pass: '#388600' }
const BAR = { before: '#87867E', fix1: '#db3707', fix2: '#388600', idle: '#C9C8C0' }
const barPhase = (i) => (i === 0 ? 'before' : i <= 3 ? 'fix1' : 'fix2')

// Build every element once. Each key press only toggles classes, so CSS transitions animate between steps.
function searchChart() {
  const bw = (CPW / SEARCH_DAYS.length) * 0.62
  let vals = ''
  let svg = `<svg viewBox="0 0 ${CW} ${CH}" class="chart" preserveAspectRatio="xMidYMid meet">`
  svg += `<defs>${Object.entries(TONE).map(([t, c]) => `<marker id="chartArrow${t}" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="0"><path d="M0,0 L10,0 L5,10 z" fill="${c}"/></marker>`).join('')}</defs>`
  for (const v of [0, 10, 20, 30, 40]) {
    svg += `<line x1="${CL}" x2="${CW - CR}" y1="${cys(v)}" y2="${cys(v)}" class="grid"/><text x="${CL - 10}" y="${cys(v) + 5}" class="ax" text-anchor="end">${v}</text>`
  }
  for (const v of [0, 1000, 2000]) svg += `<text x="${CW - CR + 10}" y="${cyn(v) + 5}" class="ax blue">${v ? v / 1000 + 'k' : 0}</text>`
  SEARCH_DAYS.forEach((r, i) => {
    const h = CT + CPH - cys(r.slow)
    svg += `<rect class="bar" data-i="${i}" x="${cx(i + 0.5) - bw / 2}" y="${cys(r.slow)}" width="${bw}" height="${h}" rx="3"/>`
    // Tall bars carry their value inside, so it never collides with the line above.
    if (r.slow >= 8) vals += `<text class="val" data-i="${i}" x="${cx(i + 0.5)}" y="${h > 40 ? cys(r.slow) + 22 : cys(r.slow) - 8}" text-anchor="middle" fill="${h > 40 ? '#fff' : BAR[barPhase(i)]}">${r.slow}</text>`
    svg += `<text x="${cx(i + 0.5)}" y="${CT + CPH + 24}" class="ax" text-anchor="middle">${r.d}</text>`
  })
  svg += `<polyline class="nline" points="${SEARCH_DAYS.map((r, i) => `${cx(i + 0.5)},${cyn(r.n)}`).join(' ')}"/>`
  svg += vals
  svg += `<text x="${CL}" y="${CH - 6}" class="ax">October 2026 (UTC)</text>`
  svg += `<text x="${CL + 200}" y="${CH - 6}" class="lg"><tspan class="sw red">■</tspan> searches over 1 second, per day</text>`
  svg += `<text x="${CW - CR}" y="${CH - 6}" class="lg" text-anchor="end"><tspan class="blue">━</tspan> search count queries per day</text>`
  SEARCH_EVENTS.forEach((e, i) => {
    const ex = cx(e.at), ly = 4 + i * 32, col = TONE[e.tone]
    svg += `<g class="ev" data-n="${e.n}">
      <line class="drop" x1="${ex}" x2="${ex}" y1="${ly + 21}" y2="${CT + CPH - 2}" stroke="${col}" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#chartArrow${e.tone})"/>
      <circle cx="${ex}" cy="${ly + 8}" r="12" fill="${col}"/><text x="${ex}" y="${ly + 13}" class="num" text-anchor="middle">${e.n}</text>
      <text class="evt" data-x="${ex}" x="${ex + 20}" y="${ly + 14}" fill="${col}">${e.text}</text>
    </g>`
  })
  svg += `<g class="summary"><rect class="sumbox" rx="12" fill="#fff" stroke="#D9D8D0"/>
    <text class="big1" x="${cx(7.5)}" y="${CT + 58}">Slow searches: <tspan fill="#db3707">about 30 a day</tspan> → <tspan fill="#388600">about 1</tspan></text>
    <text class="big1" x="${cx(7.5)}" y="${CT + 98}">Count queries: <tspan fill="#1D4AFF">1,700 a day</tspan> → <tspan fill="#1D4AFF">150</tspan></text></g>`
  return svg + '</svg>'
}

// Text widths depend on the font that actually loaded, so measure after insertion instead of guessing.
function fitChart(svg) {
  svg.querySelectorAll('.evt').forEach((t) => {
    const ex = +t.dataset.x
    const w = t.getBBox().width
    if (ex + 20 + w > CW - 8) { t.setAttribute('x', ex - 20); t.setAttribute('text-anchor', 'end') }
  })
  const lines = [...svg.querySelectorAll('.summary .big1')]
  const width = Math.max(...lines.map((l) => l.getBBox().width))
  const pad = 26
  let x0 = cx(7.5) - pad
  if (x0 + width + pad * 2 > CW - 4) x0 = CW - 4 - width - pad * 2
  lines.forEach((l) => l.setAttribute('x', x0 + pad))
  const box = svg.querySelector('.sumbox')
  box.setAttribute('x', x0); box.setAttribute('y', CT + 18)
  box.setAttribute('width', width + pad * 2); box.setAttribute('height', 118)
}

function updateChart(svg, reveal) {
  svg.querySelectorAll('.bar').forEach((b) => {
    const i = +b.dataset.i
    const lit = reveal >= 5 || (reveal >= 3 && i <= 3) || (reveal >= 1 && i === 0)
    b.style.fill = lit ? BAR[barPhase(i)] : BAR.idle
    b.style.opacity = reveal >= 2 || i === 0 ? 1 : 0.25
  })
  svg.querySelectorAll('.val').forEach((v) => {
    const i = +v.dataset.i
    v.classList.toggle('on', reveal >= 5 || (reveal >= 3 && i <= 3))
  })
  svg.querySelector('.nline').classList.toggle('on', reveal >= 5)
  svg.querySelectorAll('.ev').forEach((g) => g.classList.toggle('on', reveal >= +g.dataset.n))
  svg.querySelector('.summary').classList.toggle('on', reveal >= 6)
}

const CHAPTERS = { intro: 'Intro', search: 'Inbox search', searchchart: 'What production saw', numbers: 'The numbers', thoughts: 'Some thoughts', questions: 'Questions' }

let idx = 0
const main = document.getElementById('main')

function buildNodes() {
  const g = document.getElementById('nodes')
  const w = 140, gap = 32, y = 18, h = 46
  NODES.forEach((n, i) => {
    const x = 20 + i * (w + gap) + 20
    n.cx = x + w / 2
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g')
    el.setAttribute('class', 'node')
    el.id = `node-${n.id}`
    el.innerHTML = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><text x="${x + w / 2}" y="${y + h / 2 + 5}" text-anchor="middle">${n.label}</text>`
    g.appendChild(el)
    if (i < NODES.length - 1) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      line.setAttribute('class', 'edge')
      line.setAttribute('d', `M ${x + w + 3} ${y + h / 2} L ${x + w + gap - 4} ${y + h / 2}`)
      g.appendChild(line)
    }
  })
  // The return arrow runs from under Re-check back up into Report, so it follows the node layout.
  const from = NODES.find((n) => n.id === 'check').cx, to = NODES.find((n) => n.id === 'report').cx, low = 112, r = 40
  const back = document.getElementById('back')
  back.setAttribute('d', `M ${from} ${y + h + 2} C ${from} ${low}, ${from} ${low}, ${from - r} ${low} L ${to + r} ${low} C ${to} ${low}, ${to} ${low}, ${to} ${y + h + 6}`)
  // The draw animation needs the real length, or the end of the line and its arrowhead come apart.
  back.style.setProperty('--len', Math.ceil(back.getTotalLength()))
  document.getElementById('backlabel').setAttribute('x', (from + to) / 2)
}

function setLoop(scene) {
  const order = NODES.map((n) => n.id)
  const activeIdx = scene.node ? order.indexOf(scene.node) : -1
  NODES.forEach((n, i) => {
    const el = document.getElementById(`node-${n.id}`)
    el.classList.toggle('active', i === activeIdx)
    el.classList.toggle('done', activeIdx > -1 && i < activeIdx)
    el.classList.toggle('fail', i === activeIdx && scene.verdict === 'fail')
    el.classList.toggle('pass', i === activeIdx && scene.verdict === 'pass')
  })
  const lit = !!scene.back
  const back = document.getElementById('back')
  back.classList.remove('lit')
  if (lit) { void back.getBoundingClientRect(); back.classList.add('lit') }
  document.getElementById('backlabel').classList.toggle('lit', lit)
}

function imgs(scene) {
  if (!scene.img) return ''
  const list = Array.isArray(scene.img) ? scene.img : [scene.img]
  return `<div class="shot ${list.length > 1 ? 'pair' : ''}">${list.map((s) => `<img src="${A}${s}" alt="" onload="this.style.maxWidth = 'min(${list.length > 1 ? 49 : 100}%, ' + this.naturalWidth / 2 + 'px)'">`).join('')}</div>`
}

function render() {
  const scene = SCENES[idx]
  setLoop(scene)
  if (scene.kind === 'big') {
    main.innerHTML = `<div class="big">${scene.html}</div>`
  } else if (scene.kind === 'chart') {
    const ev = SEARCH_EVENTS[scene.reveal - 1]
    let svg = main.querySelector('svg.chart')
    if (!svg) {
      main.innerHTML = `<div class="chartwrap">
        <div class="charthead"><h2 class="chapter-title">Inbox search, as production saw it</h2><span class="steplink"></span></div>
        ${searchChart()}</div>`
      svg = main.querySelector('svg.chart')
      fitChart(svg)
      // Start from the previous step so entering the chart still animates the newest change.
      updateChart(svg, Math.max(0, scene.reveal - 1))
      void svg.getBoundingClientRect()
    }
    updateChart(svg, scene.reveal)
    main.querySelector('.steplink').innerHTML = ev ? `<a class="link" href="${ev.link}" target="_blank" rel="noopener">Open step ${ev.n} ↗</a>` : ''
  } else {
    const first = SCENES.findIndex((s) => s.chapter === scene.chapter)
    const chapterScenes = SCENES.slice(first, idx + 1)
    const steps = chapterScenes.map((s, i) => {
      const cls = [i === chapterScenes.length - 1 ? 'current' : '', s.verdict || '', i === chapterScenes.length - 1 && moved > 0 ? 'enter' : ''].join(' ')
      const tag = s.verdict === 'fail' ? '<span class="tag">✗ failed</span>' : s.verdict === 'pass' ? '<span class="tag">✓ held</span>' : ''
      return `<li class="${cls}"><span class="when">${s.delta ? `<b>${s.delta}</b><br>` : ''}${s.when}</span><span class="what">${s.what}${tag}</span></li>`
    }).join('')
    main.innerHTML = `
      <section class="timeline">
        <div class="chapter">${CHAPTERS[scene.chapter]}</div>
        <h2 class="chapter-title">${SCENES[first].title}</h2>
        <ol class="steps">${steps}</ol>
      </section>
      <section class="pane">
        <p class="say">${scene.say}</p>
        ${scene.callout ? `<p class="callout">${scene.callout}</p>` : ''}
        ${scene.links ? `<div class="links">${scene.links.map((l) => `<a class="link" href="${l.href}" target="_blank" rel="noopener">${l.label} ↗</a>`).join('')}</div>` : ''}
        ${imgs(scene)}
      </section>`
  }
  document.getElementById('crumb').textContent = `${CHAPTERS[scene.chapter]} · ${idx + 1} / ${SCENES.length}`
  document.getElementById('dots').innerHTML = SCENES.map((s, i) => (i > 0 && s.chapter !== SCENES[i - 1].chapter ? '<i class="sep"></i>' : '') + `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')
  document.getElementById('notes').innerHTML = scene.notes ? `<b>Notes</b>${scene.notes}` : '<b>Notes</b>(none)'
  history.replaceState(null, '', `#${idx + 1}`)
  document.getElementById('prev').disabled = idx === 0
  document.getElementById('next').disabled = idx === SCENES.length - 1
  if (moved) window.scrollTo(0, 0)
}

let moved = 0
function go(d) {
  const next = Math.max(0, Math.min(SCENES.length - 1, idx + d))
  if (next === idx) return
  moved = d
  idx = next
  render()
}

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox')
  if (e.key === 'Escape') { lb.classList.remove('open'); return }
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); lb.classList.remove('open'); go(1) }
  if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); lb.classList.remove('open'); go(-1) }
  if (e.key === 'n' || e.key === 'N') document.getElementById('notes').classList.toggle('open')
  if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()
  if (e.key === 'Home') { moved = 0; idx = 0; render() }
})
main.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG') {
    const lb = document.getElementById('lightbox')
    lb.querySelector('img').src = e.target.src
    lb.classList.add('open')
  }
})
document.getElementById('lightbox').addEventListener('click', (e) => e.currentTarget.classList.remove('open'))
document.getElementById('prev').addEventListener('click', () => go(-1))
document.getElementById('next').addEventListener('click', () => go(1))
// Horizontal swipes step on phones. Mostly vertical gestures still scroll, and the chart keeps its own sideways scroll.
let touch = null
document.addEventListener('touchstart', (e) => { touch = e.target.closest('.chartwrap') ? null : e.touches[0] }, { passive: true })
document.addEventListener('touchend', (e) => {
  if (!touch) return
  const dx = e.changedTouches[0].clientX - touch.clientX, dy = e.changedTouches[0].clientY - touch.clientY
  touch = null
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1)
})

buildNodes()
const fromHash = parseInt(location.hash.slice(1), 10)
if (fromHash >= 1 && fromHash <= SCENES.length) idx = fromHash - 1
render()
window.addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10)
  if (n >= 1 && n <= SCENES.length && n - 1 !== idx) { moved = 0; idx = n - 1; render() }
})
</script>
</body>
</html>
