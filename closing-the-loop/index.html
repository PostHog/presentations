<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Closing the loop</title>
<link rel="icon" href="assets/posthog-logomark.svg" />
<link rel="preload" href="assets/fonts/RoundHog-Bold-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* RoundHog and the hedgehogs come from github.com/PostHog/brand (@posthog/brand). Latin subsets only. */
  @font-face { font-family: 'RoundHog'; font-weight: 400; font-display: swap; src: url(assets/fonts/RoundHog-latin.woff2) format('woff2'); }
  @font-face { font-family: 'RoundHog'; font-weight: 500; font-display: swap; src: url(assets/fonts/RoundHog-Medium-latin.woff2) format('woff2'); }
  @font-face { font-family: 'RoundHog'; font-weight: 700; font-display: swap; src: url(assets/fonts/RoundHog-SemiBold-latin.woff2) format('woff2'); }
  @font-face { font-family: 'RoundHog'; font-weight: 800; font-display: swap; src: url(assets/fonts/RoundHog-Bold-latin.woff2) format('woff2'); }
  :root {
    /* posthog.com light neutrals */
    --bg: #eeefe9; --card: #fdfdf8; --card2: #f4f4ef; --ink: #23251d; --ink2: #65675e; --ink3: #9ea096;
    --rule: #d2d3cc; --rule2: #bfc1b7;
    /* @posthog/brand palette */
    --accent: #FF5C1C; --accent-ink: #e64a0a; --blue: #0457FF; --fail: #F00008; --fail-soft: #FFB8BA;
    --pass-core: #35B14E; --pass: #2a8a3e; --pass-soft: #B8EAC2; --lemon: #FFCE1C;
    /* the raised orange posthog.com button */
    --btn-face: #eb9d2a; --btn-base: #cd8407; --btn-edge: #b17816;
    --shadow-window: 0 1px 2px rgba(35,37,29,.06), 0 12px 32px -8px rgba(35,37,29,.22);
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --body: 'RoundHog', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 60% 50% at 100% 0%, rgba(255,206,28,.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 0% 100%, rgba(255,92,28,.06) 0%, transparent 70%),
      var(--bg);
    color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; font-variant-ligatures: none;
    overflow: hidden;
  }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 3vw 1.6vh; gap: 2vh; }

  /* Loop diagram, always visible */
  header { display: flex; align-items: center; gap: 2vw; }
  header .brand { display: flex; flex-direction: column; gap: .7vh; min-width: 15vw; }
  header .brand .logo { height: 2.6vw; width: auto; align-self: flex-start; }
  header .brand .eyebrow { font-size: 1vw; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
  header .brand .title { font-size: 2vw; font-weight: 800; letter-spacing: -.015em; line-height: 1.1; }
  .loop { flex: 1; height: 15vh; }
  .loop svg { width: 100%; height: 100%; overflow: visible; }
  /* Each node is a posthog.com OS button: a face raised on a base strip. The active one is the orange button. */
  .node .base { fill: var(--rule2); transition: all .35s; }
  .node .face { fill: var(--card); stroke: var(--rule2); stroke-width: 1.5; transition: all .35s; }
  .node text { font: 700 18px var(--body); fill: var(--ink3); transition: fill .35s; }
  .node.done .face { stroke: var(--ink3); }
  .node.done text { fill: var(--ink); }
  .node.active .face { fill: var(--btn-face); stroke: var(--btn-edge); stroke-width: 2; }
  .node.active .base { fill: var(--btn-edge); }
  .node.active text { fill: #111; font-weight: 800; }
  .node.active.fail .face { fill: var(--fail-soft); stroke: var(--fail); }
  .node.active.fail .base { fill: var(--fail); }
  .node.active.pass .face { fill: var(--pass-soft); stroke: var(--pass); }
  .node.active.pass .base { fill: var(--pass); }
  .edge { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .back { stroke: var(--rule2); stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; transition: stroke .35s; marker-end: url(#arrowBack); }
  .back.lit { stroke: var(--fail); stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease forwards; marker-end: url(#arrowFail); }
  .backlabel { font: 700 14px var(--body); fill: var(--ink3); transition: fill .35s; }
  .backlabel.lit { fill: var(--fail); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  main { display: grid; grid-template-columns: 31vw 1fr; gap: 2.4vw; min-height: 0; }

  /* Timeline */
  .timeline { display: flex; flex-direction: column; min-height: 0; }
  .chapter { font-size: 1vw; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: .6vh; }
  .chapter-title { font-size: 1.9vw; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; margin: 0 0 2vh; text-wrap: balance; }
  ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1vh; overflow: hidden; }
  ol.steps li { display: grid; grid-template-columns: 8.4vw 1fr; gap: .9vw; align-items: baseline; opacity: .45; transition: opacity .3s, transform .3s; }
  ol.steps li.current { opacity: 1; }
  ol.steps li.old { opacity: .4; }
  ol.steps li.old .when b, ol.steps li.old .when br { display: none; }
  ol.steps li.old .when { font-size: .85vw; }
  ol.steps li.old .what { font-size: 1.05vw; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ol.steps li.old .tag { font-size: .7vw; }
  ol.steps li.enter { animation: enter .35s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  .when { font-family: var(--mono); font-size: 1vw; color: var(--ink2); text-align: right; white-space: nowrap; }
  .when b { color: var(--accent-ink); font-weight: 700; }
  .what { font-size: 1.3vw; font-weight: 700; line-height: 1.3; }
  li.fail .what { color: var(--fail); }
  li.pass .what { color: var(--pass); }
  li .what .tag { display: inline-block; font-size: .85vw; font-weight: 800; padding: .1vh .55vw; border-radius: 6px; margin-left: .4vw; vertical-align: middle; color: #fff; }
  li.fail .tag { background: var(--fail); }
  li.pass .tag { background: var(--pass); }

  /* Evidence pane */
  .pane { position: relative; min-height: 0; display: flex; flex-direction: column; gap: 1.4vh; }
  .sayrow { display: flex; align-items: center; gap: 1.6vw; }
  .sayrow .say { flex: 1; }
  .hog { height: 15vh; width: auto; flex: none; animation: pop .35s ease; }
  /* A joke hedgehog fills the space under the timeline. Older steps collapse to one line so that space survives to the end of the story. */
  .meme { margin: auto 0 0; padding-top: 1.5vh; align-self: center; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; animation: pop .45s ease; }
  ol.steps { flex: none; }
  .meme img { height: 27vh; max-height: 100%; min-height: 0; width: auto; display: block; object-fit: contain; }
  .meme figcaption { position: relative; margin-bottom: -1.2vh; align-self: flex-end; font-size: 1.5vw; font-weight: 800; line-height: 1.15;
    color: var(--accent-ink); background: var(--card); border: 1.5px solid var(--rule2); border-radius: 8px; padding: .6vh .9vw;
    box-shadow: var(--shadow-window); transform: translateX(30%) rotate(-4deg); white-space: nowrap; z-index: 2; flex: none; }
  .meme.nervous img { animation: nervous .5s ease-in-out infinite; transform-origin: 50% 90%; }
  .meme img[src$="float.svg"] { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
  @keyframes nervous { 0%, 100% { transform: rotate(-1.5deg) translateX(-1px); } 50% { transform: rotate(1.5deg) translateX(1px); } }
  /* The two-panel Drake meme: no thanks on top, yes please below. */
  .meme.drake { align-self: stretch; margin-right: 1vw; background: var(--card); border: 1.5px solid var(--rule2); border-radius: 8px; box-shadow: var(--shadow-window); overflow: hidden; }
  .drake > div { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1vw; padding: .4vh 1.2vw .4vh .4vw; }
  .drake > div + div { border-top: 1.5px solid var(--rule2); }
  .drake img { height: 12vh; width: auto; display: block; }
  .drake span { font-size: 1.6vw; font-weight: 800; line-height: 1.15; }
  .drake .nah span { color: var(--ink3); text-decoration: line-through; text-decoration-color: var(--fail); text-decoration-thickness: .08em; }
  .drake .yah span { color: var(--accent-ink); }
  .meme figcaption small { display: block; margin-top: .5vh; font-size: .9vw; font-weight: 700; color: var(--ink2); }
  .say { font-size: 1.75vw; font-weight: 700; line-height: 1.3; color: var(--ink); margin: 0; text-wrap: balance; }
  .callout { margin: 0; font-size: 1.25vw; line-height: 1.4; color: var(--ink2); background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--blue); border-radius: 0 8px 8px 0; padding: 1.1vh 1vw; max-width: 52vw; }
  .callout b { color: var(--blue); }
  .say em { font-style: normal; color: var(--accent-ink); }
  .shot { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  .shot img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; background: #fff; padding: 1.1vw;
    border: 1px solid var(--rule2); box-shadow: var(--shadow-window); cursor: zoom-in; animation: pop .35s ease; }
  .shot.pair { gap: 1.4vw; align-items: flex-start; }
  .shot.pair img { max-width: 49%; }
  @keyframes pop { from { opacity: 0; transform: scale(.985); } }

  /* Big-statement scenes */
  .big { grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: center; gap: 3vh; padding: 0 4vw; }
  .big h1 { font-size: 5vw; font-weight: 800; letter-spacing: -.025em; line-height: 1.04; margin: 0; text-wrap: balance; }
  .big h1 span { color: var(--accent); }
  .big h1 span.aside { color: var(--ink3); font-weight: 700; }
  .big h1 s { color: var(--ink3); text-decoration-color: var(--accent); text-decoration-thickness: .09em; }
  .big p { font-size: 2vw; color: var(--ink2); margin: 0; max-width: 60vw; line-height: 1.35; text-wrap: balance; }
  /* A slide's takeaway line: one line, full width, in ink. */
  .big p.punch { max-width: none; font-size: 2.1vw; font-weight: 700; color: var(--ink); text-wrap: wrap; }
  .big p.punch span { color: var(--accent-ink); }
  .headrow { display: flex; align-items: center; justify-content: space-between; gap: 3vw; }
  .headrow .hog { height: 22vh; }
  /* Cards are posthog.com windows: warm surface, hairline border, a title bar. */
  /* Step 19: the points stacked on the left, a Slack thread on the right. */
  .chill { display: grid; grid-template-columns: 1fr 1.25fr; gap: 2.4vw; align-items: center; }
  .chill .stack { display: flex; flex-direction: column; gap: 1.8vh; }
  .chill h1 { font-size: 3.6vw; margin-bottom: 1vh; }
  .chill .col ul { font-size: 1.2vw; }
  .slackwrap { position: relative; margin-top: 4vh; }
  /* The surfer rides the thread's header bar, which is empty on the right. */
  .slackwrap .surf { position: absolute; right: 1.2vw; bottom: 100%; margin-bottom: -6.2vh; height: 12vh; width: auto; z-index: 2; }
  .slack { background: #fff; border: 1px solid var(--rule2); border-radius: 8px; box-shadow: var(--shadow-window); overflow: hidden;
    font-family: Lato, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 1vw; line-height: 1.4; color: #1d1c1d; }
  .slack-head { font-weight: 800; padding: .8vh 1.2vw; border-bottom: 1px solid #e8e8e8; }
  .slack .msg { display: grid; grid-template-columns: 2.3vw 1fr; gap: .8vw; padding: .8vh 1.2vw; }
  .slack .msg > div { display: flex; flex-direction: column; gap: .5vh; min-width: 0; }
  .slack .av { width: 2.3vw; height: 2.3vw; border-radius: 6px; background: #f4f4ef; padding: .3vw; object-fit: contain; }
  .slack .av.me { display: grid; place-items: center; padding: 0; background: var(--accent); color: #fff; font-weight: 800; font-size: .8vw; }
  .slack .who { font-weight: 800; }
  .slack .who i { font-style: normal; font-size: .65vw; font-weight: 700; color: #616061; background: #ebeaeb; border-radius: 3px; padding: 0 .3vw; margin-left: .2vw; vertical-align: .1em; }
  .slack time { font-weight: 400; font-size: .8vw; color: #616061; margin-left: .3vw; }
  .slack .card { border-left: 4px solid #ddd; padding-left: .8vw; display: flex; flex-direction: column; gap: .4vh; }
  .slack .card .title { font-weight: 700; }
  .slack em { font-style: italic; }
  .slack code { font-family: var(--mono); font-size: .85em; color: #c01343; background: #f6f6f6; border: 1px solid #e8e8e8; border-radius: 3px; padding: 0 .2em; }
  .slack mark { background: color-mix(in srgb, var(--lemon) 45%, transparent); color: inherit; border-radius: 2px; padding: 0 .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .slack .sbtn { align-self: flex-start; font-weight: 700; font-size: .85vw; border: 1px solid #c8c8c8; border-radius: 6px; padding: .2vh .7vw; }
  .slack .sbtn.go { background: #007a5a; border-color: #007a5a; color: #fff; box-shadow: 0 0 0 0 rgba(0,122,90,.5); animation: ping 2s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(0,122,90,.45); } 70%, 100% { box-shadow: 0 0 0 .7vw rgba(0,122,90,0); } }
  .slack .fixrow { display: flex; align-items: center; gap: 1vw; }
  .slack .nudge { font-family: var(--body); font-weight: 800; font-size: 1.15vw; color: var(--accent-ink); transform: rotate(-3deg); white-space: nowrap; }
  .slack .react { align-self: flex-start; font-size: .8vw; border: 1px solid #1d9bd1; background: #e8f5fa; border-radius: 99px; padding: 0 .5vw; color: #1264a3; }
  .slack .meta { font-size: .8vw; color: #616061; }
  .slack .at { color: #1264a3; background: #e8f5fa; border-radius: 3px; padding: 0 .15vw; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6vw; }
  .stat { background: var(--card); border: 1px solid var(--rule2); border-radius: 8px; padding: 2.4vh 1.4vw; box-shadow: var(--shadow-window); }
  .stat .n { font-size: 4.4vw; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .stat .l { font-size: 1.25vw; color: var(--ink2); margin-top: 1.2vh; line-height: 1.3; }
  .stat.hot .n { color: var(--fail); }
  .cols { display: grid; grid-template-columns: 1fr .7fr 1fr; gap: 1.6vw; }
  .cols.two { grid-template-columns: 1fr 1fr; }
  .col { background: var(--card); border: 1px solid var(--rule2); border-radius: 8px; padding: 0 1.6vw 2.2vh; box-shadow: var(--shadow-window); overflow: hidden; }
  .col .k { font-size: 1vw; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink);
    margin: 0 -1.6vw 1.8vh; padding: 1vh 1.6vw; background: var(--card2); border-bottom: 1px solid var(--rule); }
  .col ul { margin: 0; padding-left: 1.2em; font-size: 1.6vw; line-height: 1.45; font-weight: 700; }
  .col li::marker { color: var(--accent); }
  .col li em { font-style: normal; color: var(--accent-ink); }
  .col.cheap { background: transparent; border-style: dashed; color: var(--ink3); box-shadow: none; }
  .col.cheap .k { color: var(--ink3); background: transparent; border-bottom-style: dashed; }
  .col.cheap li::marker { color: var(--ink3); }
  .dial .bar { height: 2.2vh; border-radius: 99px; background: linear-gradient(90deg, var(--pass-core), var(--lemon), var(--fail)); border: 1.5px solid rgba(35,37,29,.25); }
  .dial .ends { display: flex; justify-content: space-between; gap: 4vw; margin-top: 1.6vh; font-size: 1.5vw; color: var(--ink2); line-height: 1.35; }
  .dial .ends > div { max-width: 32vw; }
  .dial .ends > div:last-child { text-align: right; }
  .dial .ends b { display: block; font-size: 2vw; color: var(--ink); }
  .flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2vw; counter-reset: f; }
  .flow li { position: relative; background: var(--card); border: 1px solid var(--rule2); border-radius: 8px; padding: 1.8vh 1.1vw; font-size: 1.3vw; font-weight: 700; line-height: 1.35; box-shadow: var(--shadow-window); }
  .flow li:not(:last-child)::after { content: '→'; position: absolute; right: -1.05vw; top: 50%; transform: translateY(-50%); color: var(--ink3); font-size: 1.3vw; }
  .flow .who { display: block; font-size: .9vw; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: .8vh; }
  .flow .who.me { color: var(--accent-ink); }
  .flow .who.bot { color: var(--blue); }
  .qa { display: grid; grid-template-columns: 1fr auto; gap: 4vw; align-items: center; }
  .posts { display: flex; flex-direction: column; gap: 1vh; margin-top: 2.4vh; }
  .posts .k { font-size: 1vw; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); margin-top: 1.4vh; }
  .posts a.feature { font-size: 2.2vw; color: var(--accent-ink); }
  .posts a.feature small { display: block; font-family: var(--mono); font-size: .95vw; font-weight: 500; color: var(--ink2); }
  .posts a { font-size: 1.45vw; font-weight: 700; color: var(--ink); text-decoration: none; border-left: 4px solid var(--accent); padding-left: 1vw; }
  .posts a:hover { color: var(--accent-ink); }
  .side { display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  .side .hog { height: 26vh; }
  .qr { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
  .qr img { width: 24vw; max-width: 50vh; background: #fff; border-radius: 8px; padding: 1vw; border: 1px solid var(--rule2); box-shadow: var(--shadow-window); }
  .qr.small img { width: 12vw; }
  .qa > div { display: flex; flex-direction: column; gap: 3vh; }
  .qr figcaption { font-size: 1vw; font-weight: 700; color: var(--ink2); }
  .footnote, .big p.footnote { font-size: 1.05vw; font-weight: 500; color: var(--ink3); }

  /* Link buttons: the raised posthog.com OS button. */
  .links { display: flex; flex-wrap: wrap; gap: .8vw; margin-top: -.2vh; }
  a.link, .nav button { display: inline-flex; align-items: center; font: 700 .95vw var(--body); color: var(--ink); text-decoration: none;
    padding: .45vh .85vw; border: 1.5px solid var(--ink3); border-radius: 6px; background: var(--card);
    box-shadow: 0 2px 0 var(--rule2), 0 3.5px 0 var(--ink3); transform: translateY(-2px); transition: transform .05s, box-shadow .05s; cursor: pointer; }
  a.link:first-child, .nav button { background: var(--btn-face); border-color: var(--btn-edge); color: #111;
    box-shadow: 0 2px 0 var(--btn-base), 0 3.5px 0 var(--btn-edge); }
  a.link:hover, .nav button:hover { transform: translateY(-3px); }
  a.link:active, .nav button:active { transform: translateY(-.5px); box-shadow: 0 .5px 0 var(--btn-base), 0 2px 0 var(--btn-edge); }

  .chartwrap { grid-column: 1 / -1; display: flex; flex-direction: column; min-height: 0; gap: 1vh; }
  .charthead { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; }
  .charthead .chapter-title { margin: 0; }
  svg.chart { flex: 1; min-height: 0; width: 100%; }
  svg.chart .grid { stroke: var(--rule); stroke-width: 1; }
  svg.chart .ax { font: 500 14px var(--mono); fill: var(--ink2); }
  svg.chart .ax.blue, svg.chart .blue { fill: var(--blue); }
  svg.chart .lg { font: 700 15px var(--body); fill: var(--ink2); }
  svg.chart .sw.red { fill: var(--fail); }
  svg.chart .val { font: 700 15px var(--mono); paint-order: stroke; stroke: rgba(0,0,0,.18); stroke-width: 3px; opacity: 0; transition: opacity .4s .2s; }
  svg.chart .val.on { opacity: 1; }
  svg.chart .nline { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linejoin: round; opacity: .22; transition: opacity .6s; }
  svg.chart .nline.on { opacity: 1; }
  svg.chart .num { font: 800 15px var(--body); fill: #fff; }
  svg.chart .evt { font: 800 18px var(--body); }
  svg.chart .big1 { font: 800 24px var(--body); fill: var(--ink); }
  svg.chart .bar { transition: fill .5s ease, opacity .5s ease; }
  svg.chart .ev { opacity: 0; transform: translateY(-6px); transition: opacity .35s ease, transform .35s ease; }
  svg.chart .ev.on { opacity: 1; transform: none; }
  svg.chart .ev .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); transition: transform .5s ease .1s; }
  svg.chart .ev.on .drop { transform: scaleY(1); }
  svg.chart .summary { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }
  svg.chart .summary.on { opacity: 1; transform: none; }
  .steplink { min-height: 1.6em; }

  footer { display: flex; align-items: center; justify-content: space-between; font-size: .95vw; font-weight: 700; color: var(--ink2); }
  footer .crumbwrap { display: flex; align-items: center; gap: .6vw; }
  footer .crumbwrap img { height: 1.4vw; width: auto; }
  .keys { font-weight: 500; color: var(--ink3); }

        <img class="hog" src="${A}hogs/speaker-1.svg" alt="">
        <figure class="qr"><img src="${A}qr.svg" alt="QR code for this walkthrough"><figcaption>posthog.github.io/presentations/closing-the-loop</figcaption></figure>
      </div>
    </div>`,
    notes: 'Scan for this walkthrough. From our inbox is where I post real examples like this one every few days. The blog posts go deeper on loops, scouts and skills.' },
]

// Inbox search count spans per day (posthog-web-django, SELECT COUNT(*) on signals_signalreport with the
// UPPER(title) LIKE search predicate), from posthog.trace_spans. Database spans for this service start at 03:02 UTC on 13 Oct, so the chart starts that day.
const SEARCH_DAYS = [
  { d: '13', n: 1725, slow: 3, p99: 865 },
  { d: '14', n: 1708, slow: 32, p99: 2011 },
  { d: '15', n: 1754, slow: 38, p99: 1712 },
  { d: '16', n: 1090, slow: 29, p99: 1617 },
  { d: '17', n: 214, slow: 2, p99: 790 },
  { d: '18', n: 125, slow: 1, p99: 779 },
  { d: '19', n: 192, slow: 2, p99: 743 },
  { d: '20', n: 324, slow: 8, p99: 2283 },
  { d: '21', n: 136, slow: 2, p99: 1231 },
  { d: '22', n: 154, slow: 1, p99: 751 },
  { d: '23', n: 155, slow: 1, p99: 676 },
  { d: '24', n: 214, slow: 0, p99: 661 },
  { d: '25', n: 143, slow: 1, p99: 633 },
  { d: '26', n: 169, slow: 1, p99: 827 },
]
// Day offsets from 13 Oct 00:00 UTC.
const SEARCH_EVENTS = [
  { at: 0 + 5.3 / 24, n: 1, text: 'Report: search counts are slow', tone: 'ink', link: 'https://us.posthog.com/project/2/inbox/01a133b3-b87d-7d72-a0d9-502221f9906d' },
  { at: 1 + 6.45 / 24, n: 2, text: 'Index fix merged. "10x faster"', tone: 'ink', link: 'https://github.com/PostHog/posthog/pull/115874' },
  { at: 3 + 15.72 / 24, n: 3, text: 'Re-check: still slow. New report', tone: 'fail', link: 'https://us.posthog.com/project/2/inbox/01a14561-c1a5-7523-acdf-489788bffb08' },
  { at: 3 + 17.92 / 24, n: 4, text: 'Second fix merged', tone: 'ink', link: 'https://github.com/PostHog/posthog/pull/118678' },
  { at: 6 + 2.67 / 24, n: 5, text: 'Re-check: holds', tone: 'pass', link: 'https://us.posthog.com/project/2/inbox/01a14561-c1a5-7523-acdf-489788bffb08' },
]

const CW = 1000, CH = 520, CL = 60, CR = 70, CT = 175, CB = 60
const CPW = CW - CL - CR, CPH = CH - CT - CB
const cx = (t) => CL + (t / SEARCH_DAYS.length) * CPW
const cys = (v) => CT + CPH - (v / 40) * CPH
const cyn = (v) => CT + CPH - (v / 2000) * CPH
const TONE = { ink: '#23251d', fail: '#F00008', pass: '#2a8a3e' }
const BAR = { before: '#65675e', fix1: '#FF474D', fix2: '#35B14E', idle: '#d2d3cc' }
const barPhase = (i) => (i === 0 ? 'before' : i <= 3 ? 'fix1' : 'fix2')

// Build every element once. Each key press only toggles classes, so CSS transitions animate between steps.
function searchChart() {
  const bw = (CPW / SEARCH_DAYS.length) * 0.62
  let vals = ''
  let svg = `<svg viewBox="0 0 ${CW} ${CH}" class="chart" preserveAspectRatio="xMidYMid meet">`
  svg += `<defs>${Object.entries(TONE).map(([t, c]) => `<marker id="chartArrow${t}" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="0"><path d="M0,0 L10,0 L5,10 z" fill="${c}"/></marker>`).join('')}</defs>`
  for (const v of [0, 10, 20, 30, 40]) {
    svg += `<line x1="${CL}" x2="${CW - CR}" y1="${cys(v)}" y2="${cys(v)}" class="grid"/><text x="${CL - 10}" y="${cys(v) + 5}" class="ax" text-anchor="end">${v}</text>`
  }
  for (const v of [0, 1000, 2000]) svg += `<text x="${CW - CR + 10}" y="${cyn(v) + 5}" class="ax blue">${v ? v / 1000 + 'k' : 0}</text>`
  SEARCH_DAYS.forEach((r, i) => {
    const h = CT + CPH - cys(r.slow)
    svg += `<rect class="bar" data-i="${i}" x="${cx(i + 0.5) - bw / 2}" y="${cys(r.slow)}" width="${bw}" height="${h}" rx="3"/>`
    // Tall bars carry their value inside, so it never collides with the line above.
    if (r.slow >= 8) vals += `<text class="val" data-i="${i}" x="${cx(i + 0.5)}" y="${h > 40 ? cys(r.slow) + 22 : cys(r.slow) - 8}" text-anchor="middle" fill="${h > 40 ? '#fff' : BAR[barPhase(i)]}">${r.slow}</text>`
    svg += `<text x="${cx(i + 0.5)}" y="${CT + CPH + 24}" class="ax" text-anchor="middle">${r.d}</text>`
  })
  svg += `<polyline class="nline" points="${SEARCH_DAYS.map((r, i) => `${cx(i + 0.5)},${cyn(r.n)}`).join(' ')}"/>`
  svg += vals
  svg += `<text x="${CL}" y="${CH - 6}" class="ax">October 2026 (UTC)</text>`
  svg += `<text x="${CL + 200}" y="${CH - 6}" class="lg"><tspan class="sw red">■</tspan> searches over 1 second, per day</text>`
  svg += `<text x="${CW - CR}" y="${CH - 6}" class="lg" text-anchor="end"><tspan class="blue">━</tspan> search count queries per day</text>`
  SEARCH_EVENTS.forEach((e, i) => {
    const ex = cx(e.at), ly = 4 + i * 32, col = TONE[e.tone]
    svg += `<g class="ev" data-n="${e.n}">
      <line class="drop" x1="${ex}" x2="${ex}" y1="${ly + 21}" y2="${CT + CPH - 2}" stroke="${col}" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#chartArrow${e.tone})"/>
      <circle cx="${ex}" cy="${ly + 8}" r="12" fill="${col}"/><text x="${ex}" y="${ly + 13}" class="num" text-anchor="middle">${e.n}</text>
      <text class="evt" data-x="${ex}" x="${ex + 20}" y="${ly + 14}" fill="${col}">${e.text}</text>
    </g>`
  })
  svg += `<g class="summary"><rect class="sumbox" rx="8" fill="#fdfdf8" stroke="#bfc1b7" style="filter: drop-shadow(0 8px 16px rgba(35,37,29,.18))"/>
    <text class="big1" x="${cx(7.5)}" y="${CT + 58}">Slow searches: <tspan fill="${TONE.fail}">about 30 a day</tspan> → <tspan fill="${TONE.pass}">about 1</tspan></text>
    <text class="big1" x="${cx(7.5)}" y="${CT + 98}">Count queries: <tspan fill="#0457FF">1,700 a day</tspan> → <tspan fill="#0457FF">150</tspan></text></g>`
  return svg + '</svg>'
}

// Text widths depend on the font that actually loaded, so measure after insertion instead of guessing.
function fitChart(svg) {
  svg.querySelectorAll('.evt').forEach((t) => {
    const ex = +t.dataset.x
    const w = t.getBBox().width
    if (ex + 20 + w > CW - 8) { t.setAttribute('x', ex - 20); t.setAttribute('text-anchor', 'end') }
  })
  const lines = [...svg.querySelectorAll('.summary .big1')]
  const width = Math.max(...lines.map((l) => l.getBBox().width))
  const pad = 26
  let x0 = cx(7.5) - pad
  if (x0 + width + pad * 2 > CW - 4) x0 = CW - 4 - width - pad * 2
  lines.forEach((l) => l.setAttribute('x', x0 + pad))
  const box = svg.querySelector('.sumbox')
  box.setAttribute('x', x0); box.setAttribute('y', CT + 18)
  box.setAttribute('width', width + pad * 2); box.setAttribute('height', 118)
}

function updateChart(svg, reveal) {
  svg.querySelectorAll('.bar').forEach((b) => {
    const i = +b.dataset.i
    const lit = reveal >= 5 || (reveal >= 3 && i <= 3) || (reveal >= 1 && i === 0)
    b.style.fill = lit ? BAR[barPhase(i)] : BAR.idle
    b.style.opacity = reveal >= 2 || i === 0 ? 1 : 0.25
  })
  svg.querySelectorAll('.val').forEach((v) => {
    const i = +v.dataset.i
    v.classList.toggle('on', reveal >= 5 || (reveal >= 3 && i <= 3))
  })
  svg.querySelector('.nline').classList.toggle('on', reveal >= 5)
  svg.querySelectorAll('.ev').forEach((g) => g.classList.toggle('on', reveal >= +g.dataset.n))
  svg.querySelector('.summary').classList.toggle('on', reveal >= 6)
}

const CHAPTERS = { intro: 'Intro', search: 'Inbox search', searchchart: 'What production saw', thoughts: 'Some thoughts', questions: 'Questions' }

let idx = 0
const main = document.getElementById('main')

function buildNodes() {
  const g = document.getElementById('nodes')
  const w = 140, gap = 32, y = 18, h = 46
  NODES.forEach((n, i) => {
    const x = 20 + i * (w + gap) + 20
    n.cx = x + w / 2
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g')
    el.setAttribute('class', 'node')
    el.id = `node-${n.id}`
    el.innerHTML = `<rect class="base" x="${x}" y="${y + 4}" width="${w}" height="${h}" rx="8"/><rect class="face" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text x="${x + w / 2}" y="${y + h / 2 + 5}" text-anchor="middle">${n.label}</text>`
    g.appendChild(el)
    if (i < NODES.length - 1) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      line.setAttribute('class', 'edge')
      line.setAttribute('d', `M ${x + w + 3} ${y + h / 2} L ${x + w + gap - 4} ${y + h / 2}`)
      g.appendChild(line)
    }
  })
  // The return arrow runs from under Re-check back up into Report, so it follows the node layout.
  const from = NODES.find((n) => n.id === 'check').cx, to = NODES.find((n) => n.id === 'report').cx, low = 112, r = 40
  const back = document.getElementById('back')
  back.setAttribute('d', `M ${from} ${y + h + 2} C ${from} ${low}, ${from} ${low}, ${from - r} ${low} L ${to + r} ${low} C ${to} ${low}, ${to} ${low}, ${to} ${y + h + 6}`)
  // The draw animation needs the real length, or the end of the line and its arrowhead come apart.
  back.style.setProperty('--len', Math.ceil(back.getTotalLength()))
  document.getElementById('backlabel').setAttribute('x', (from + to) / 2)
}

function setLoop(scene) {
  const order = NODES.map((n) => n.id)
  const activeIdx = scene.node ? order.indexOf(scene.node) : -1
  NODES.forEach((n, i) => {
    const el = document.getElementById(`node-${n.id}`)
    el.classList.toggle('active', i === activeIdx)
    el.classList.toggle('done', activeIdx > -1 && i < activeIdx)
    el.classList.toggle('fail', i === activeIdx && scene.verdict === 'fail')
    el.classList.toggle('pass', i === activeIdx && scene.verdict === 'pass')
  })
  const lit = !!scene.back
  const back = document.getElementById('back')
  back.classList.remove('lit')
  if (lit) { void back.getBoundingClientRect(); back.classList.add('lit') }
  document.getElementById('backlabel').classList.toggle('lit', lit)
}

function imgs(scene) {
  if (!scene.img) return ''
  const list = Array.isArray(scene.img) ? scene.img : [scene.img]
  return `<div class="shot ${list.length > 1 ? 'pair' : ''}">${list.map((s) => `<img src="${A}${s}" alt="" onload="this.style.maxWidth = 'min(${list.length > 1 ? 49 : 100}%, ' + this.naturalWidth / 2 + 'px)'">`).join('')}</div>`
}

function render() {
  const scene = SCENES[idx]
  setLoop(scene)
  if (scene.kind === 'big') {
    main.innerHTML = `<div class="big">${scene.html}</div>`
  } else if (scene.kind === 'chart') {
    const ev = SEARCH_EVENTS[scene.reveal - 1]
    let svg = main.querySelector('svg.chart')
    if (!svg) {
      main.innerHTML = `<div class="chartwrap">
        <div class="charthead"><h2 class="chapter-title">Inbox search, as production saw it</h2><span class="steplink"></span></div>
        ${searchChart()}</div>`
      svg = main.querySelector('svg.chart')
      fitChart(svg)
      // Start from the previous step so entering the chart still animates the newest change.
      updateChart(svg, Math.max(0, scene.reveal - 1))
      void svg.getBoundingClientRect()
    }
    updateChart(svg, scene.reveal)
    main.querySelector('.steplink').innerHTML = ev ? `<a class="link" href="${ev.link}" target="_blank" rel="noopener">Open step ${ev.n} ↗</a>` : ''
  } else {
    const first = SCENES.findIndex((s) => s.chapter === scene.chapter)
    const chapterScenes = SCENES.slice(first, idx + 1)
    const steps = chapterScenes.map((s, i) => {
      const cls = [i === chapterScenes.length - 1 ? 'current' : '', i < chapterScenes.length - 2 ? 'old' : '', s.verdict || '', i === chapterScenes.length - 1 && moved > 0 ? 'enter' : ''].join(' ')
      const tag = s.verdict === 'fail' ? '<span class="tag">✗ failed</span>' : s.verdict === 'pass' ? '<span class="tag">✓ held</span>' : ''
      return `<li class="${cls}"><span class="when">${s.delta ? `<b>${s.delta}</b><br>` : ''}${s.when}</span><span class="what">${s.what}${tag}</span></li>`
    }).join('')
    main.innerHTML = `
      <section class="timeline">
        <div class="chapter">${CHAPTERS[scene.chapter]}</div>
        <h2 class="chapter-title">${SCENES[first].title}</h2>
        <ol class="steps">${steps}</ol>
        ${scene.drake ? `<figure class="meme drake">${['nah', 'yah'].map((k, i) => `<div class="${k}"><img src="${A}hogs/drake-${k}.svg" alt=""><span>${scene.drake[i]}</span></div>`).join('')}</figure>` : ''}
        ${scene.meme ? `<figure class="meme${scene.nervous ? ' nervous' : ''}"><figcaption>${scene.memeCaption}</figcaption><img src="${A}hogs/${scene.meme}.svg" alt=""></figure>` : ''}
      </section>
      <section class="pane">
        <div class="sayrow"><p class="say">${scene.say}</p>${scene.hog ? `<img class="hog" src="${A}hogs/${scene.hog}.svg" alt="">` : ''}</div>
        ${scene.callout ? `<p class="callout">${scene.callout}</p>` : ''}
        ${scene.links ? `<div class="links">${scene.links.map((l) => `<a class="link" href="${l.href}" target="_blank" rel="noopener">${l.label} ↗</a>`).join('')}</div>` : ''}
        ${imgs(scene)}
      </section>`
  }
  document.getElementById('crumb').textContent = `${CHAPTERS[scene.chapter]} · ${idx + 1} / ${SCENES.length}`
  document.getElementById('dots').innerHTML = SCENES.map((s, i) => (i > 0 && s.chapter !== SCENES[i - 1].chapter ? '<i class="sep"></i>' : '') + `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')
  document.getElementById('notes').innerHTML = scene.notes ? `<b>Notes</b>${scene.notes}` : '<b>Notes</b>(none)'
  history.replaceState(null, '', `#${idx + 1}`)
  document.getElementById('prev').disabled = idx === 0
  document.getElementById('next').disabled = idx === SCENES.length - 1
  if (moved) window.scrollTo(0, 0)
}

let moved = 0
function go(d) {
  const next = Math.max(0, Math.min(SCENES.length - 1, idx + d))
  if (next === idx) return
  moved = d
  idx = next
  render()
}

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox')
  if (e.key === 'Escape') { lb.classList.remove('open'); return }
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); lb.classList.remove('open'); go(1) }
  if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); lb.classList.remove('open'); go(-1) }
  if (e.key === 'n' || e.key === 'N') document.getElementById('notes').classList.toggle('open')
  if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()
  if (e.key === 'Home') { moved = 0; idx = 0; render() }
})
main.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG') {
    const lb = document.getElementById('lightbox')
    lb.querySelector('img').src = e.target.src
    lb.classList.add('open')
  }
})
document.getElementById('lightbox').addEventListener('click', (e) => e.currentTarget.classList.remove('open'))
document.getElementById('prev').addEventListener('click', () => go(-1))
document.getElementById('next').addEventListener('click', () => go(1))
// Horizontal swipes step on phones. Mostly vertical gestures still scroll, and the chart keeps its own sideways scroll.
let touch = null
document.addEventListener('touchstart', (e) => { touch = e.target.closest('.chartwrap') ? null : e.touches[0] }, { passive: true })
document.addEventListener('touchend', (e) => {
  if (!touch) return
  const dx = e.changedTouches[0].clientX - touch.clientX, dy = e.changedTouches[0].clientY - touch.clientY
  touch = null
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1)
})

buildNodes()
const fromHash = parseInt(location.hash.slice(1), 10)
if (fromHash >= 1 && fromHash <= SCENES.length) idx = fromHash - 1
render()
window.addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10)
  if (n >= 1 && n <= SCENES.length && n - 1 !== idx) { moved = 0; idx = n - 1; render() }
})
</script>
</body>
</html>
