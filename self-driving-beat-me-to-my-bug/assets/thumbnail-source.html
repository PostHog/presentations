<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:linear-gradient(180deg,#FFF1D5 0%,#DAE0EB 100%);
       font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#141414;
       padding:92px 104px;position:relative}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:500;
           letter-spacing:.13em;text-transform:uppercase;color:#6F6E66}
  .mark{position:absolute;top:88px;right:104px;width:86px}
  .col{width:1010px;display:flex;flex-direction:column;height:calc(100% - 40px)}
  h1{font-size:112px;font-weight:800;line-height:1.03;letter-spacing:-.035em;margin-top:86px}
  h1 em{font-style:normal;color:#F54E00}
  .sub{font-size:36px;line-height:1.35;color:#3F3E39;margin-top:36px;max-width:24ch}
  .who{margin-top:auto;display:flex;align-items:center;gap:24px}
  .who img{width:104px;height:104px;border-radius:50%;object-fit:cover;
           border:4px solid #fff;box-shadow:0 0 0 3px #F54E00}
  .who .n{font-size:34px;font-weight:700;line-height:1.25}
  .who .r{font-size:25px;color:#6F6E66;line-height:1.35;margin-top:2px}
  .art{position:absolute;right:60px;bottom:82px;width:600px}
  .art img{width:100%;display:block;border-radius:22px}
</style></head><body>
  <p class="eyebrow">September Demo Day ft. PostHog &nbsp;|&nbsp; AI Tinkerers NYC</p>
  <img class="mark" src="../../img/posthog-logomark.svg" alt="PostHog">
  <div class="art"><img src="self-driving-hog.png" alt=""></div>
  <div class="col">
    <h1>The self-driving loop <em>beat me</em> to my own bug</h1>
    <p class="sub">Five minutes, no slides. It opened the pull request 42 seconds after I started fixing the same bug by hand.</p>
    <div class="who">
      <img src="jake.jpg" alt="Jake Ruth">
      <div><div class="n">Jake Ruth</div><div class="r">Product Engineer &middot; PostHog</div></div>
    </div>
  </div>
</body></html>
